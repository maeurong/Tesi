# Dichiarazione dell'esperimento sulla scansione di laboratorio (corsa di riferimento).
# Stessa forma di experiments/muro/esperimento.yaml; i livelli di downsample.voxel_size
# sono l'intorno del valore che rende praticabile lo step 4 su questa nuvola (brief Task 12, Step 1).
name: lab_crop
base: lab.yaml
known_thickness: 176.0
axes:
  - path: downsample.voxel_size
    values: [5.0, 10.0, 15.0]
  - path: surface.poisson_depth
    values: [7, 8, 9]
  - path: surface.density_quantile
    values: [0.0, 0.05, 0.12]
  - path: tet.min_ratio
    values: [1.7, 1.8, 2.0, 2.5]
  - path: tet.nobisect
    values: [false, true]
sweep:
  runs_root: runs/sweep
  # workers abbassato da 4 a 2: memoria libera sulla macchina ~9 GB su 15,8 GB
  # totali, e ogni candidato lavora su 6,3 milioni di punti con un picco
  # misurato di TetGen di 1,35 GB da solo. Quattro candidati in volo insieme
  # (5,4 GB di solo TetGen, piu il resto della pipeline per ciascuno) non
  # lasciano margine su questa macchina. Parametro di macchina, non un
  # risultato dell'esperimento.
  workers: 2
  timeout_s: 1800.0
