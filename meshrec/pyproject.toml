[project]
name = "meshrec"
version = "0.1.0"
description = "Pipeline riproducibile da nuvola di punti a modello FEM di muratura"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "open3d>=0.19",
    "tetgen>=0.6",
    "meshio>=5.3",
    "pydantic>=2.7",
    "pymeshfix>=0.18.1",
    "pymeshlab>=2025.7.post1",
    "pyyaml>=6.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.3",
    # Generatore della mesh esaedrica dei modelli parametrici (core/hexa.py):
    # serve a ogni corsa di un modello, non a una prova di fattibilita', quindi
    # non e' piu' un extra. Era gia' dichiarato fra le dipendenze facoltative e
    # gia' usato da core/gmsh_backend.py.
    "gmsh>=4.15.2",
]

[project.scripts]
meshrec = "meshrec.cli:main"

[project.optional-dependencies]
feasibility = []

[dependency-groups]
dev = [
    "httpx2>=2.10.0",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meshrec"]
artifacts = ["src/meshrec/ui/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not feasibility and not validazione'"
markers = [
    "feasibility: verifica di fattibilita di una dipendenza esterna (Fase 0)",
    "validazione: verifica dei codici di calcolo contro un riferimento esterno (Fase 7)",
]
