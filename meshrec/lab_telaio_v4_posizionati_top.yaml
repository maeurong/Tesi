# Fase 6: stessa corsa dimostrativa di lab_telaio_v4_posizionati_corretto.yaml,
# con TORSIONE spostata dal selettore appoggio (= BASE, l'insieme vincolato:
# una coppia li' non sposta nulla, finisce tutta in reazione) al selettore
# nuovo sommita (= TOP), che non e' vincolato e regge davvero un braccio.
# appoggio resta dichiarato e non citato: lecito per contratto, e mostra
# comunque la quarta forma di selettore nel resoconto del § 7.
# Braccio 490.7 mm: lo stesso della riga "TOP as-built peggiore" gia'
# pubblicata al § 6.2 (nodi 1197/1285, rapporto fuori asse 0,003552) -- la
# stessa identica misura, questa volta usata a scrivere un deck vero.
